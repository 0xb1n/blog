[params]
  author = 'Net Runner'
  tagline = '0xb1n4ry'
  avatar = '/images/avatar.webp'
  banner = '/images/banner.webp'
  enableSearch = false
  enableMouseGlow = false
  customCSS = ['css/osi.css']
  googleFontsURL = 'https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap'

[params.sidebar]
  showRecent = false

[markup]
  [markup.highlight]
    guessSyntax = true
    noClasses = false
    lineNos = false
    lineNumbersInTable = true

[privacy]
  [privacy.vimeo]
    disableCookies = true
    enableDNT = true
